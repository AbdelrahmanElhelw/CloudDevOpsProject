apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
        app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth-container
        image: 800770414458.dkr.ecr.us-east-2.amazonaws.com/ivolve-app-repo:auth-8
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ivolve-configmap
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: ivolve-configmap
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: ivolve-configmap
              key: DB_USER
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: ivolve-configmap
              key: DB_NAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ivolve-secret
              key: DB_PASSWORD