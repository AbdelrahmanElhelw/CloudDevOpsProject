apiVersion: v1
kind: ConfigMap
metadata:
  name: ivolve-configmap
  namespace: ivolve
data:
# Database and Auth services environment variables
  DB_HOST: "database-svc"
  DB_NAME: ivolve
  DB_PORT: "3306"
