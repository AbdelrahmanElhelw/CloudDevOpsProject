---
- name: Clean up old Jenkins list
  file:
    path: /etc/apt/sources.list.d/jenkins.list
    state: absent

- name: Add missing Jenkins GPG key directly from Ubuntu Keyserver
  apt_key:
    keyserver: keyserver.ubuntu.com
    id: 7198F4B714ABFC68
    state: present

- name: Add Jenkins repository
  apt_repository:
    repo: deb https://pkg.jenkins.io/debian-stable binary/
    state: present
    filename: jenkins

- name: Update apt cache and install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Ensure Jenkins service is started and enabled
  systemd:
    name: jenkins
    state: started
    enabled: yes
    daemon_reload: yes