apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/abdelrahmanelhelw/CloudDevOpsProject.git'
    targetRevision: HEAD
    path: kubernetes 
  destination:
    # ده اللينك الداخلي للكوبرنيتيس (ثابت مبيتغيرش)
    server: 'https://kubernetes.default.svc'
    namespace: ivolve
  syncPolicy:
    automated:
      prune: true      
      selfHeal: true   
    syncOptions:
      - CreateNamespace=true 