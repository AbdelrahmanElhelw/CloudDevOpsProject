apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap-deployment
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap
  template:
    metadata:
      labels:
        app: roadmap
    spec:
      containers:
      - name: roadmap-container
        image: <your-ecr-repo-url>/roadmap-service:latest
        ports:
        - containerPort: 8080
    